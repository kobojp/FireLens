[project]
name = "firelens"
version = "1.1.0"
description = "FireLens 滅火器、放置盒與燈具更換照片管理工具"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.119,<1",
  "openpyxl>=3.1.5,<4",
  "pillow>=11,<13",
  "pillow-heif>=1,<2",
  "python-multipart>=0.0.20,<1",
  "pywebview>=5,<7",
  "uvicorn[standard]>=0.37,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyinstaller>=6,<7",
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend", "滅火器更換照片"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
